<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A52D5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  <g transform="translate(50, 50)">
    <!-- Credit card -->
    <rect x="-30" y="-15" width="60" height="35" rx="4" fill="white"/>
    <rect x="-25" y="-5" width="20" height="5" rx="1" fill="#6C63FF" opacity="0.5"/>
    <rect x="-25" y="5" width="30" height="4" rx="1" fill="#6C63FF" opacity="0.3"/>
    <rect x="-25" y="12" width="15" height="4" rx="1" fill="#6C63FF" opacity="0.3"/>
  </g>
</svg>
